(function () {
  const PAGE = 'project.html?p=';
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  };
  const slugify = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  const images = it => (it.images || []).filter(Boolean);
  const documents = it => (it.documents || []).filter(d => d && d.file);

  async function load() {
    const res = await fetch('data/portfolio.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    const items = await res.json();
    if (!Array.isArray(items)) throw new Error('bad data');
    const rel = p => String(p || '').replace(/^\/+/, '');
    return items.map(it => Object.assign({}, it, {
      slug: slugify(it.title),
      images: (it.images || []).filter(Boolean).map(rel),
      documents: (it.documents || []).filter(d => d && d.file).map(d => Object.assign({}, d, { file: rel(d.file) }))
    }));
  }

  // Text with **bold**, blank-line paragraphs and "- " bullets
  function inline(node, text) {
    text.split(/(\*\*[^*]+\*\*)/).forEach(part => {
      if (/^\*\*[^*]+\*\*$/.test(part)) node.append(el('strong', null, part.slice(2, -2)));
      else if (part) node.append(document.createTextNode(part));
    });
    return node;
  }
  function renderBody(text, parent) {
    let para = [], list = null;
    const flush = () => { if (para.length) { parent.append(inline(el('p'), para.join(' '))); para = []; } };
    String(text || '').split('\n').forEach(raw => {
      const l = raw.trim(), m = l.match(/^[-*]\s+(.*)/);
      if (!l) { flush(); list = null; }
      else if (m) { flush(); if (!list) { list = el('ul'); parent.append(list); } list.append(inline(el('li'), m[1])); }
      else { list = null; para.push(l); }
    });
    flush();
  }

  function excerpt(it) {
    if (it.summary && it.summary.trim()) return { text: it.summary.trim(), more: true };
    const blocks = String(it.description || '').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
    const first = (blocks.find(b => !/^[-*]\s/.test(b)) || '').replace(/\*\*/g, '').replace(/\s*\n\s*/g, ' ');
    const words = first.split(/\s+/).filter(Boolean);
    const cut = words.length > 32;
    return { text: cut ? words.slice(0, 32).join(' ') + ' …' : first, more: cut || blocks.length > 1 };
  }

  function renderCard(it) {
    const href = PAGE + encodeURIComponent(it.slug);
    const imgs = images(it);
    const art = el('article', 'entry');
    if (imgs.length) {
      const a = el('a');
      a.href = href; a.tabIndex = -1; a.setAttribute('aria-hidden', 'true');
      const i = el('img');
      i.src = imgs[0]; i.alt = ''; i.loading = 'lazy';
      a.append(i);
      art.append(a);
    }
    const h = el('h4');
    const t = el('a', null, it.title || 'Untitled');
    t.href = href;
    h.append(t);
    art.append(h);
    const ex = excerpt(it);
    if (ex.text) art.append(el('p', null, ex.text));
    if (ex.more || imgs.length > 1 || documents(it).length) {
      const m = el('a', 'more', 'Continue reading');
      m.href = href;
      art.append(m);
    }
    return art;
  }

  async function home() {
    const root = document.getElementById('entries');
    try {
      const items = await load();
      if (!items.length) { root.replaceChildren(el('p', 'status', 'No projects yet. Add one in the editor.')); return; }
      const byYear = new Map();
      items.forEach(it => {
        const y = it.year || 'Other';
        if (!byYear.has(y)) byYear.set(y, []);
        byYear.get(y).push(it);
      });
      const years = [...byYear.keys()].sort((a, b) => (Number(b) || 0) - (Number(a) || 0));
      root.replaceChildren(...years.map(y => {
        const sec = el('section', 'year');
        sec.append(el('h3', null, String(y)));
        const grid = el('div', 'grid');
        byYear.get(y).forEach(it => grid.append(renderCard(it)));
        sec.append(grid);
        return sec;
      }));
    } catch (e) {
      root.replaceChildren(el('p', 'status', 'The portfolio could not load. If you opened index.html directly from your computer, serve the folder instead: run "python3 -m http.server" in it and open http://localhost:8000.'));
    }
  }

  async function projectPage() {
    const main = document.getElementById('project');
    const side = document.getElementById('side');
    const banner = document.getElementById('banner');
    try {
      const items = await load();
      const slug = new URLSearchParams(location.search).get('p');
      side.append(el('h2', null, 'Portfolio'));
      const ul = el('ul');
      items.forEach(it => {
        const li = el('li');
        const a = el('a', null, it.title || 'Untitled');
        a.href = PAGE + encodeURIComponent(it.slug);
        if (it.slug === slug) a.setAttribute('aria-current', 'page');
        li.append(a);
        ul.append(li);
      });
      side.append(ul);

      const it = items.find(x => x.slug === slug);
      if (!it) {
        banner.remove();
        const back = el('a', null, 'Back to the portfolio');
        back.href = 'index.html#portfolio';
        const p = el('p'); p.append(back);
        main.replaceChildren(el('h1', null, 'Project not found'), p);
        return;
      }
      document.title = (it.title || 'Project') + ' | Riley Parado';
      const imgs = images(it);
      if (imgs.length) { const i = el('img'); i.src = imgs[0]; i.alt = ''; banner.append(i); } else banner.remove();
      main.replaceChildren(el('h1', null, it.title || 'Untitled'));
      renderBody(it.description, main);
      if (imgs.length) {
        const g = el('div', 'gallery');
        imgs.forEach(s => { const i = el('img'); i.src = s; i.alt = it.title || ''; i.loading = 'lazy'; g.append(i); });
        main.append(g);
      }
      const docs = documents(it);
      if (docs.length) {
        const dl = el('ul');
        docs.forEach(d => {
          const li = el('li');
          const a = el('a', null, d.label || 'Document');
          a.href = d.file;
          li.append(a);
          dl.append(li);
        });
        main.append(dl);
      }
    } catch (e) {
      banner.remove();
      main.replaceChildren(el('p', 'status', 'This project could not load. If you opened the file directly from your computer, run "python3 -m http.server" in the folder and open http://localhost:8000.'));
    }
  }

  if (document.getElementById('entries')) home();
  else if (document.getElementById('project')) projectPage();
})();
